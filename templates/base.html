<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brokerage_name }} — Email Intake AI</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --border: #e3e0d8;
    --ink: #232019;
    --muted: #6b6355;
    --accent: #a3552e;
    --ok-bg: #e7f3ea; --ok-fg: #2c6e3f;
    --warn-bg: #fbeeea; --warn-fg: #a3401b;
    --info-bg: #eaf0f6; --info-fg: #2b578c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.2px; }
  header .tag { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 32px 64px; }
  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 10px 16px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .stat-row { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 20px; min-width: 150px;
  }
  .stat .n { font-size: 24px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  th, td { padding: 12px 14px; text-align: left; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  th { background: #faf9f6; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #faf8f4; }
  a { color: var(--accent); text-decoration: none; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.info { background: var(--info-bg); color: var(--info-fg); }
  .type-pill { font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 0 0 12px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; background: #faf9f6; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .flags li { margin-bottom: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }
  .backlink { display: inline-block; margin-bottom: 16px; font-size: 13px; }
  .conf { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>{{ brokerage_name }} — Email Intake AI</h1>
    <div class="tag">Inbox → extraction → structured record → action</div>
  </div>
  <div style="display:flex; gap:10px;">
    <form method="post" action="/process-inbox"><button class="btn" type="submit">Process Inbox</button></form>
    <form method="post" action="/reset-demo" onsubmit="return confirm('Clear all demo records?');"><button class="btn secondary" type="submit">Reset Demo Data</button></form>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
